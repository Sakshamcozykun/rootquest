services:
  rootquest:
    build: .
    image: rootquest:latest
    container_name: rootquest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      FLAG_SECRET: ${FLAG_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      MAX_GROUP_SIZE: ${MAX_GROUP_SIZE:-10}
      SUBMIT_LIMIT_PER_MIN: ${SUBMIT_LIMIT_PER_MIN:-5}
      DAILY_TZ_OFFSET_MIN: ${DAILY_TZ_OFFSET_MIN:-330}
    volumes:
      - rootquest-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rootquest-data:
