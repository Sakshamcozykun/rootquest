# Fly.io config. First time:
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly volumes create rootquest_data --size 1 --region sin
#   fly secrets set ADMIN_PASSWORD='<strong-password>'
#   fly deploy
app = "rootquest"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "rootquest_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
